<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敦新科技 個人資料表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1814;--ink2:#3d3a34;--ink3:#7a7570;--paper:#faf9f6;--paper2:#f2f0eb;--paper3:#e8e5de;--accent:#e8671a;--accent2:#c9540f;--accent-light:#fef3ec;--navy:#1a3a8f;--danger:#8b2020;--warning:#7a5c00;--gold:#c9a227;--radius:4px;--radius-lg:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.page{display:none;min-height:100vh}.page.active{display:flex;flex-direction:column}
.serif{font-family:'DM Serif Display',serif}
input,select,textarea{font-family:'Noto Sans TC',sans-serif;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--paper3);border-radius:var(--radius);padding:10px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,103,26,.12)}
input[readonly],input:disabled{background:var(--paper2);color:var(--ink3);cursor:not-allowed}
textarea{min-height:70px;resize:vertical;line-height:1.6}
label{font-size:13px;font-weight:500;color:var(--ink2);display:block;margin-bottom:5px}
button{font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;padding:11px 24px}.btn-primary:hover{background:var(--accent2)}.btn-primary:disabled{background:var(--paper3);color:var(--ink3);cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--ink2);border:1px solid var(--paper3);padding:10px 20px}.btn-secondary:hover{background:var(--paper2)}
.toast{position:fixed;bottom:80px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius-lg);font-size:14px;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.toast.success{background:var(--accent)}.toast.error{background:var(--danger)}
/* INTRO */
#pg-intro,#pg-done{background:var(--paper);align-items:center;justify-content:center;padding:40px 20px}
.intro-wrap{width:100%;max-width:640px}
.intro-header{text-align:center;margin-bottom:32px}
.intro-header img{height:52px;object-fit:contain;margin-bottom:14px}
.intro-header .serif{font-size:34px;color:var(--ink);line-height:1.2;margin-bottom:8px}
.intro-header p{font-size:15px;color:var(--ink3);line-height:1.7}
.intro-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px}
.intro-card-top{background:var(--accent);padding:18px 22px;display:flex;align-items:center;gap:14px}
.intro-card-top .icon-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px}
.intro-card-top h2{color:#fff;font-size:17px;font-weight:500}.intro-card-top p{color:rgba(255,255,255,.8);font-size:13px}
.intro-card-body{padding:18px 22px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.info-item{background:var(--paper2);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:10px}
.info-item .ii-icon{font-size:18px}.info-item p{font-size:12px;color:var(--ink3);margin-bottom:2px}.info-item strong{font-size:14px;color:var(--ink)}
.notice-box{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:11px 14px;font-size:14px;color:var(--ink2);line-height:1.7}
/* FORM */
#pg-form{background:var(--paper)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,249,246,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--paper3);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px}
.topbar img{height:33px;object-fit:contain}
.topbar .ttl{font-size:14px;font-weight:500;flex:1;margin-left:10px;color:var(--ink2)}
.topbar .stt{font-size:12px;color:var(--ink3);text-align:right}.topbar .stt.ok{color:var(--accent)}
.progress-track{height:3px;background:var(--paper3);overflow:hidden}.progress-fill{height:100%;width:0;background:var(--accent);transition:width .4s}
.form-wrap{width:100%;max-width:860px;margin:0 auto;padding:22px 20px 120px}
.form-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);padding:22px 22px 10px;margin-bottom:20px}
.form-card>h3{font-size:16px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.form-card>h3::before{content:'';display:inline-block;width:3px;height:16px;background:var(--accent);border-radius:2px}
.form-card>.hint{font-size:13px;color:var(--ink3);margin:0 0 14px 11px}
.sub-title{font-size:14px;font-weight:500;color:var(--accent2);margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px;margin-bottom:14px}
.grid .wide{grid-column:1/-1}
.fg label span.rq{color:var(--danger);margin-left:2px}
.rg{display:flex;flex-wrap:wrap;gap:8px 18px;padding:4px 0}
.rg label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:400;cursor:pointer;margin:0}
.rg input{width:auto;padding:0;accent-color:var(--accent)}
.rowcard{border:1px dashed var(--paper3);border-radius:var(--radius-lg);padding:12px 14px 2px;margin-bottom:12px;background:var(--paper)}
.rowcard h4{font-size:13px;font-weight:500;color:var(--accent2);margin-bottom:8px}
.err-f input,.err-f select,.err-f textarea{border-color:var(--danger);background:#fff7f6}
.err-f .rg{outline:1px solid var(--danger);border-radius:var(--radius);padding:4px 8px}
.photo{display:flex;gap:14px;align-items:center}
.photo .box{width:90px;height:120px;border:1px dashed var(--paper3);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px;text-align:center;overflow:hidden;background:var(--paper2);flex-shrink:0}
.photo img{width:100%;height:100%;object-fit:cover}
.photo small{display:block;color:var(--ink3);font-size:12px;margin-top:5px}
.consent{max-height:240px;overflow:auto;border:1px solid var(--paper3);border-radius:var(--radius);padding:12px 14px;font-size:13px;background:var(--paper);margin-bottom:12px;line-height:1.7}
.consent h5{margin:8px 0 3px;font-size:13px;font-weight:500}.consent p{margin:2px 0;color:var(--ink2)}
.banner{border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:14px;line-height:1.7}
.banner.err{background:#fceaea;border-left:3px solid var(--danger);color:var(--danger)}
.banner.info{background:var(--accent-light);border-left:3px solid var(--accent);color:var(--ink2)}
.errlist{margin:6px 0 0 18px}.errlist a{cursor:pointer;text-decoration:underline}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--paper3);padding:12px 16px;display:flex;gap:10px;justify-content:center;z-index:20}
.done-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);padding:40px 32px;text-align:center;max-width:520px;width:100%}
.done-card .big{font-size:48px;margin-bottom:10px}.done-card h2{font-size:22px;font-weight:500;margin-bottom:10px}.done-card p{color:var(--ink3);line-height:1.8;font-size:14px}
@media(max-width:560px){.info-grid{grid-template-columns:1fr}.intro-header .serif{font-size:28px}.form-card{padding:18px 14px 6px}.topbar .ttl{display:none}}
</style>
</head>

<script src="supabase-config.js"></script>

<script src="demo-api.js"></script>
<script>
/* ═══════ 設定：填入 Apps Script 部署後的 Web App URL ═══════ */
var API_URL = '';            // Supabase 版不使用 Apps Script
var DEMO = false;   // 尚未設定網址時為示範模式：不送出資料，僅在本機模擬
var DRAFT_KEY = 'dx_resume_draft_v1';

var $ = function (s) { return document.querySelector(s); };
var form, submitId = null, dirty = false, timer = null, submitting = false, t0 = Date.now();   // t0：開始填寫時間（用於偵測機器人）

/* ═══════ 表單產生 ═══════ */
function build() { $('#sections').innerHTML = RS.formHTML({ consentHTML: CONSENT }); }

/* ═══════ 收集／回填 ═══════ */
function collect() {
  var d = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name || el.disabled) return;            // 不可填寫的欄位（簽章、日期）不納入
    if (el.type === 'radio') { if (el.checked) d[el.name] = el.value; }
    else if (el.type === 'checkbox') { if (el.checked) d[el.name] = '1'; }
    else if (el.value !== '') d[el.name] = el.value;
  });
  return d;
}
function fill(d) {
  RS.ensureCards(form, d);                          // 草稿裡有第 2、3… 組的資料時，先把對應的組別長出來
  Object.keys(d).forEach(function (k) {
    form.querySelectorAll('[name="' + k + '"]').forEach(function (el) {
      if (el.type === 'radio') el.checked = (el.value === d[k]);
      else if (el.type === 'checkbox') el.checked = (d[k] === '1');
      else el.value = d[k];
    });
  });
  showPhoto(d.photo); recalc(); progress();
}
function showPhoto(src) { $('#photoBox').innerHTML = src ? '<img src="' + src + '" alt="照片">' : '2 吋照片<br>（上傳電子檔）'; }
function num(n) { var v = parseFloat((form.elements[n] || {}).value); return isNaN(v) ? 0 : v; }
function recalc() {                                   // 每一組工作經歷各自合計（組數不限）
  Array.prototype.forEach.call(form.querySelectorAll('input[name^="job."][name$=".total"]'), function (el) {
    var k = el.name.replace(/total$/, '');
    var t = num(k + 'fixed') + num(k + 'allow') + num(k + 'other');
    el.value = t ? t : '';
    var m = num(k + 'fixed_m') + num(k + 'perf_m') + num(k + 'bonus_m');
    form.elements[k + 'total_m'].value = m ? Math.round(m * 100) / 100 : '';
  });
}
function syncAddr() {
  if (!form.elements['addr.same'].checked) return;
  form.elements['addr.mail'].value = form.elements['addr.reg'].value;
  form.elements['addr.mail_tel'].value = form.elements['addr.reg_tel'].value;
}
function progress() {
  var d = collect(), req = RS.list.filter(function (e) { return e.f.req; }), n = 0;
  req.forEach(function (e) { if (d[e.key]) n++; });
  $('#prog').style.width = Math.round(n / req.length * 100) + '%';
}

/* ═══════ 草稿（僅存在本機瀏覽器）═══════ */
function setStt(t, ok) { var e = $('#stt'); e.textContent = t; e.className = 'stt' + (ok ? ' ok' : ''); }
function saveDraft(manual) {
  clearTimeout(timer);
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ id: submitId, ts: Date.now(), t0: t0, data: collect() }));
    dirty = false;
    setStt('草稿已暫存 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }), true);
    if (manual) toast('草稿已暫存在此瀏覽器', 'success');
  } catch (e) {
    setStt('無法暫存（瀏覽器限制）');
    if (manual) toast('此瀏覽器無法暫存草稿，請一次填寫完成', 'error');
  }
}
function markDirty() { dirty = true; setStt('編輯中…'); clearTimeout(timer); timer = setTimeout(function () { saveDraft(false); }, 1200); progress(); }
function newId() {
  var b = (window.crypto && crypto.getRandomValues) ? Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(12)), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('') : String(Math.random()).slice(2) + String(Date.now());
  return 'R' + Date.now().toString(36).toUpperCase() + '-' + b;
}

/* ═══════ 驗證 ═══════ */
function validate() {
  var d = collect(), errs = [];
  form.querySelectorAll('.err-f').forEach(function (x) { x.classList.remove('err-f'); });
  RS.list.forEach(function (e) { if (e.f.req && !d[e.key]) errs.push({ n: e.key, l: e.label + ' 尚未填寫' }); });
  var id = d['basic.id_no'];
  if (id && !/^[A-Za-z][A-Za-z0-9]\d{8}$/.test(id)) errs.push({ n: 'basic.id_no', l: '身份證字號格式不正確' });
  if (d['basic.email'] && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d['basic.email'])) errs.push({ n: 'basic.email', l: 'E-mail 格式不正確' });
  if (d['basic.mobile'] && !/^[0-9+\-\s()]{8,}$/.test(d['basic.mobile'])) errs.push({ n: 'basic.mobile', l: '行動電話格式不正確' });
  // 任用諮詢：至少完整填寫一位；填了一半的也要補完整
  var refF = ['name', 'company', 'title', 'tel', 'rel'], refDone = 0, refIdx = { 0: 1 };
  Object.keys(d).forEach(function (k) { var m = /^ref\.(\d+)\./.exec(k); if (m) refIdx[m[1]] = 1; });     // 有填的每一組諮詢人都要檢查
  Object.keys(refIdx).map(Number).sort(function (x, y) { return x - y; }).forEach(function (i) {
    var got = refF.filter(function (k) { return d['ref.' + i + '.' + k]; }).length;
    if (got === refF.length) refDone++;
    else if (got > 0) refF.forEach(function (k) { if (!d['ref.' + i + '.' + k]) errs.push({ n: 'ref.' + i + '.' + k, l: '諮詢人' + (i + 1) + ' 資料請填寫完整（缺：' + RS.labelOf('ref.' + i + '.' + k).replace(/^諮詢人\d+ /, '') + '）' }); });
  });
  if (!refDone && !errs.some(function (e) { return /^ref\./.test(e.n); })) refF.forEach(function (k, j) { errs.push({ n: 'ref.0.' + k, l: '任用諮詢請至少完整填寫一位（姓名、公司、職稱、聯絡電話、關係皆須填寫）', quiet: j > 0 }); });
  if (!['grad', 'univ', 'college', 'high'].some(function (k) { return d['edu.' + k + '.school']; })) errs.push({ n: 'edu.high.school', l: '請至少填寫一筆教育程度' });
  if (!d['job.none'] && !d['job.0.company']) errs.push({ n: 'job.0.company', l: '請填寫工作經歷，或勾選「無工作經歷（應屆畢業）」' });
  RS.list.forEach(function (e) { if (/\.note$/.test(e.key)) { var p = e.key.replace(/\.note$/, ''); if (d[p] === '有' && !d[e.key]) errs.push({ n: e.key, l: e.label.replace('－說明', '') + '選「有」，請填寫說明' }); } });
  errs.forEach(function (e) { var b = form.querySelector('[data-f="' + e.n + '"]'); if (b) b.classList.add('err-f'); });
  return errs;
}

/* ═══════ 送出 ═══════ */
function jsonp(payload, ms) {
  return new Promise(function (res, rej) {
    var cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6), s = document.createElement('script'), done = false;
    var t = setTimeout(function () { if (!done) { done = true; cleanup(); rej(new Error('timeout')); } }, ms || 15000);
    function cleanup() { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function (r) { if (done) return; done = true; cleanup(); res(r); };
    s.onerror = function () { if (!done) { done = true; cleanup(); rej(new Error('network')); } };
    s.src = API_URL + '?payload=' + encodeURIComponent(JSON.stringify(payload)) + '&callback=' + cb + '&_t=' + Date.now();
    document.body.appendChild(s);
  });
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function exists() { return jsonp({ action: 'checkResume', id: submitId }, 12000).then(function (r) { return !!(r && r.exists); }).catch(function () { return false; }); }

var lastError = '';
var ERRMAP = {
  too_fast: '填寫時間過短，請確認內容後再送出',
  busy: '目前送出人數較多，請 10 分鐘後再試',
  too_many_requests: '送出次數過多，請稍後再試',
  missing_required: '尚有必填欄位未填寫（姓名、行動電話、E-mail）',
  bad_email: 'E-mail 格式不正確',
  consent_required: '請勾選同意個人資料告知事項',
  field_too_long: '有欄位內容過長，請縮短後再送出',
  too_many_fields: '資料欄位過多',
  origin_not_allowed: '此網站不被允許送出資料，請聯繫人資'
};
async function transmit(data) {
  var photo = data.photo || ''; delete data.photo;
  var payload = { id: submitId, data: data, photo: photo, hp: ($('#hp') || {}).value || '', elapsed: Math.round((Date.now() - t0) / 1000) };
  lastError = '';
  try {
    var res = await fetch(SB.url + '/functions/v1/submit-resume', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    var j = await res.json().catch(function () { return {}; });
    if (res.ok && j.ok) return true;
    lastError = ERRMAP[j.error] || ('送出失敗（' + (j.error || res.status) + '），請稍後再試');
  } catch (e) { lastError = '網路異常，請檢查網路後再試'; }
  return false;
}

async function submitResume() {
  if (submitting) return;
  var allErrs = validate(), errs = allErrs.filter(function (e) { return !e.quiet; }), n = $('#notice');
  if (errs.length) {
    n.innerHTML = '<div class="banner err"><b>還有 ' + errs.length + ' 項需要補充：</b><ul class="errlist">' + errs.map(function (e) { return '<li><a data-go="' + e.n + '">' + e.l + '</a></li>'; }).join('') + '</ul></div>';
    window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  if (!confirm('送出後資料將鎖定，無法自行修改。確定要送出嗎？')) return;
  submitting = true; var btn = $('#btn-submit'); btn.disabled = true; btn.textContent = '送出中，請勿關閉頁面…';
  saveDraft(false);
  var ok = await transmit(collect());
  submitting = false; btn.disabled = false; btn.textContent = '送出資料';
  if (ok) {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    dirty = false;
    $('#done-id').textContent = '受理編號：' + submitId;
    showPage('pg-done'); window.scrollTo(0, 0);
  } else {
    n.innerHTML = '<div class="banner err"><b>' + (lastError || '尚未確認送出成功。') + '</b>您的內容已保留在此頁面與瀏覽器中，確認後可再按一次「送出資料」（不會重複建立資料）。</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ═══════ 其他 ═══════ */
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function showPage(id) { document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); }); $('#' + id).classList.add('active'); }
function toast(m, t) { var e = $('#toast'); e.textContent = m; e.className = 'toast show ' + (t || ''); setTimeout(function () { e.className = 'toast'; }, 3000); }
function startForm() { showPage('pg-form'); window.scrollTo(0, 0); }

function onPhoto(e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var W = 480, H = 640, s = Math.max(W / img.width, H / img.height);
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'), w = img.width * s, h = img.height * s;
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    var q = 0.85, data = c.toDataURL('image/jpeg', q);
    while (data.length > 400000 && q > 0.3) { q -= 0.1; data = c.toDataURL('image/jpeg', q); }
    form.elements['photo'].value = data; showPhoto(data); URL.revokeObjectURL(url); markDirty();
  };
  img.onerror = function () { toast('無法讀取此圖片，請換一張', 'error'); };
  img.src = url;
}

var CONSENT = RS.consentHTML();       // 個資告知事項全文（定義在 resume-schema.js）

(function init() {
  build();
  form = $('#rf');
  var draft = null;
  try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) {}
  submitId = (draft && draft.id) || newId();
  if (draft && draft.t0) t0 = draft.t0;
  if (draft && draft.data) {
    fill(draft.data);
    $('#notice').innerHTML = '<div class="banner info">已為您還原上次未送出的草稿。 <a style="cursor:pointer;text-decoration:underline" onclick="clearDraft()">清除草稿重新開始</a></div>';
    setStt('已還原草稿', true);
  }
  if (!form.elements['job.date'].value) form.elements['job.date'].value = today();
  try {                                              // 面試邀約信件的連結：?name= 一定帶入中文姓名、?job= 帶入應徵職務（連結優先於舊草稿）
    var qp = new URLSearchParams(location.search), qn = (qp.get('name') || '').trim().slice(0, 100), qj = (qp.get('job') || '').trim().slice(0, 200);
    if (qn) form.elements['basic.name_zh'].value = qn;
    if (qj) form.elements['job.title'].value = qj;                 // 應徵職務
    if (qn || qj) progress();
  } catch (e) {}
  if (DEMO) $('#notice').innerHTML += '<div class="banner info"><b>【示範模式】</b>尚未設定 Apps Script 網址，送出時不會寫入試算表，只會存在本機示範資料（可在示範後台看到）。</div>';

  form.addEventListener('input', function (e) {
    if (e.target.name && /^job\.\d+\.(fixed|allow|other|fixed_m|perf_m|bonus_m)$/.test(e.target.name)) recalc();
    if (form.elements['addr.same'].checked && /^addr\.(same|reg|reg_tel)$/.test(e.target.name)) syncAddr();
    markDirty();
  });
  form.addEventListener('change', function (e) { if (e.target.id !== 'photoFile') { if (e.target.name === 'addr.same') syncAddr(); markDirty(); } });
  $('#photoFile').addEventListener('change', onPhoto);
  $('#notice').addEventListener('click', function (e) {
    var g = e.target.getAttribute && e.target.getAttribute('data-go'); if (!g) return;
    var el = form.querySelector('[data-f="' + g + '"]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && dirty) saveDraft(false); });
  window.addEventListener('beforeunload', function (e) { if (dirty || submitting) { e.preventDefault(); e.returnValue = ''; } });
})();
function clearDraft() { if (!confirm('確定清除目前的草稿並重新開始？')) return; try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} location.reload(); }
</script>
