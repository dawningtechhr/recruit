<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人資料管理後台（Supabase）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>

:root{
  --ink:#1a1814;--ink2:#3d3a34;--ink3:#7a7570;
  --paper:#faf9f6;--paper2:#f2f0eb;--paper3:#e8e5de;
  --accent:#e8671a;--accent2:#c9540f;--accent-light:#fef3ec;--navy:#1a3a8f;
  --danger:#8b2020;--warning:#7a5c00;--gold:#c9a227;
  --radius:4px;--radius-lg:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.serif{font-family:'DM Serif Display',serif}

input,select,textarea{font-family:'Noto Sans TC',sans-serif;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--paper3);border-radius:var(--radius);padding:10px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,103,26,.12)}
label{font-size:13px;font-weight:500;color:var(--ink2);display:block;margin-bottom:5px}
button{font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;padding:11px 24px}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:transparent;color:var(--ink2);border:1px solid var(--paper3);padding:10px 20px}
.btn-secondary:hover{background:var(--paper2);border-color:var(--ink3)}
.btn-danger{background:var(--danger);color:#fff;padding:10px 20px}
.btn-danger:hover{filter:brightness(1.15)}
.btn-sm{padding:7px 14px;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}

/* SCREENS */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ── LOGIN ── */
#s-login{align-items:center;justify-content:center;background:var(--paper)}
.login-box{width:100%;max-width:400px;padding:20px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .serif{font-size:34px;color:var(--ink);display:block;line-height:1.2}
.login-logo p{color:var(--ink3);font-size:13px;margin-top:6px;letter-spacing:.03em}
.login-card{background:#fff;border-radius:var(--radius-lg);padding:32px}
.login-card h2{font-size:18px;font-weight:500;margin-bottom:20px;color:var(--ink)}
.login-err{background:#fceaea;color:var(--danger);font-size:13px;padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;display:none}
.login-footer{text-align:center;margin-top:20px;font-size:12px;color:var(--ink3)}
.login-hint{text-align:center;margin-top:14px;font-size:12px}

/* ── ADMIN LAYOUT ── */
#s-admin{flex-direction:row}
.sidebar{width:224px;flex-shrink:0;background:var(--paper2);border-right:1px solid var(--paper3);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--paper3)}
.sidebar-logo .serif{color:var(--ink);font-size:20px;display:block}
.sidebar-logo p{color:var(--ink3);font-size:11px;margin-top:3px}
.sidebar-nav{flex:1;padding:14px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:14px;color:var(--ink3);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--paper3);color:var(--ink)}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:500}
.nav-item .ni{font-size:16px;width:18px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--paper3)}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.su-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:500;flex-shrink:0}
.su-name{font-size:13px;color:var(--ink);font-weight:500}
.su-role{font-size:11px;color:var(--ink3)}
.btn-logout{width:100%;background:var(--paper3);color:var(--ink2);border:none;padding:8px;border-radius:var(--radius);font-size:13px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:var(--paper3);filter:brightness(.93);color:var(--ink)}

.admin-main{flex:1;overflow-y:auto;background:var(--paper)}
.tab-content{display:none;padding:28px 32px;max-width:1100px}
.tab-content.active{display:block}
.page-title{font-size:22px;font-weight:500;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--ink3);margin-bottom:24px}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);padding:18px 20px}
.stat-card .sc-val{font-size:28px;font-weight:500;margin-bottom:4px}
.stat-card .sc-lbl{font-size:13px;color:var(--ink3)}
.sc-chg.up{font-size:12px;margin-top:6px;color:var(--accent)}

/* TABLE */
.table-wrap{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);overflow:hidden}
.table-head{padding:16px 20px;border-bottom:1px solid var(--paper3);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-head h3{font-size:16px;font-weight:500}
.search-bar{position:relative;flex:1;max-width:280px}
.search-bar input{padding:8px 12px 8px 34px;font-size:14px}
.search-bar .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:16px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--ink3);text-align:left;padding:11px 16px;background:var(--paper2);border-bottom:1px solid var(--paper3)}
td{font-size:14px;padding:13px 16px;border-bottom:1px solid var(--paper3);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--paper2)}

/* REPORT MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:740px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--paper3);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px;font-weight:500}
.btn-close{background:var(--paper2);color:var(--ink2);border:none;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--paper3);display:flex;gap:10px;justify-content:flex-end}

.report-section{margin-bottom:20px}
.report-section h4{font-size:13px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--paper3)}
.applicant-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.ai-item{background:var(--paper2);border-radius:var(--radius);padding:10px 14px}
.ai-item .lbl{font-size:12px;color:var(--ink3);margin-bottom:2px}
.ai-item .val{font-size:14px;font-weight:500}
.big5-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.big5-lbl{font-size:13px;width:72px;flex-shrink:0}
.big5-track{flex:1;height:8px;background:var(--paper3);border-radius:4px;overflow:hidden}
.big5-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .8s ease}
.big5-val{font-size:13px;font-weight:500;width:36px;text-align:right;flex-shrink:0}
.type-highlight{background:var(--accent);color:#fff;border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:4px}
.type-highlight .th-type{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:4px}
.type-highlight .th-desc{font-size:13px;opacity:.85;line-height:1.6}
.career-tag{background:var(--accent-light);color:var(--accent);font-size:13px;font-weight:500;padding:5px 12px;border-radius:20px;display:inline-block;margin:3px}
.interview-tip{background:#fff8e1;border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;font-size:14px;line-height:1.7;color:var(--ink2)}

/* ADMIN CARDS */
.admin-list{display:grid;gap:14px}
.admin-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);padding:18px 20px;display:flex;align-items:center;gap:16px}
.adm-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;color:var(--accent);flex-shrink:0}
.adm-info{flex:1}
.adm-name{font-weight:500;font-size:15px;margin-bottom:2px}
.adm-sub{font-size:13px;color:var(--ink3)}
.adm-actions{display:flex;gap:8px}
.adm-role-badge{font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px}
.role-super{background:#fdf3d0;color:#7a5c00}
.role-admin{background:var(--accent-light);color:var(--accent)}

/* SETTINGS */
.settings-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
.settings-card h3{font-size:16px;font-weight:500;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--paper3)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius-lg);font-size:14px;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--accent)}
.toast.error{background:var(--danger)}

/* ── Print styles ── */
@media print {
  body > * { display:none !important; }
  #modal-report { display:block !important; position:static !important; background:none !important; padding:0 !important; width:100% !important; }
  #modal-report .modal { display:block !important; max-height:none !important; box-shadow:none !important; border:none !important; max-width:100% !important; }
  #modal-report .modal-body { display:block !important; padding:0 !important; overflow:visible !important; }
  #modal-report .modal-head { display:flex !important; border-bottom:2px solid #e8671a !important; }
  .no-print, .modal-foot, .btn-close { display:none !important; }
  #report-print-area { display:block !important; }
  @page { margin:15mm; size:A4; }
}
/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(250,249,246,.9);z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-overlay.hidden{display:none}
.spinner{width:40px;height:40px;border:4px solid #e8e5de;border-top-color:#e8671a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{font-size:15px;color:#3d3a34;font-family:'Noto Sans TC',sans-serif}
.conn-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.conn-ok{background:#fef3ec;color:#e8671a}
.conn-err{background:#fceaea;color:#8b2020}
/* Essay report styles */
.essay-item{background:#f7f6f2;border-radius:6px;padding:14px 16px;margin-bottom:12px;border-left:3px solid #e8671a}
.essay-item .eq{font-size:13px;font-weight:600;color:#e8671a;margin-bottom:8px;line-height:1.5}
.essay-item .ea{font-size:14px;color:#3d3a34;line-height:1.8;white-space:pre-wrap}
.essay-item .ea-empty{font-size:13px;color:#7a7570;font-style:italic}
/* Score badges */
.score-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:500}
.score-badge.basic{background:#fef3ec;color:#e8671a}
.score-badge.mid{background:#fef9e7;color:#7a5c00}
.score-badge.hard{background:#fceaea;color:#8b2020}
.score-bar-wrap{margin-bottom:10px}
.score-bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.score-bar-track{height:8px;background:#e8e5de;border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:4px;transition:width .6s}

/* 個人資料後台補充 */
.stat-grid{grid-template-columns:repeat(3,1fr)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.photo-thumb{float:right;margin:0 0 8px 14px}
#modal-report .modal-foot{flex-wrap:wrap}
#modal-report .modal-foot button{flex:0 0 104px;width:104px;min-width:104px;padding-left:0;padding-right:0;white-space:nowrap;text-align:center}
/* 編輯視窗（與求職者填寫頁相同的表單） */
#edit-form .form-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--radius-lg);padding:16px 18px 6px;margin-bottom:14px}
#edit-form .form-card>h3{font-size:15px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#edit-form .form-card>h3::before{content:'';display:inline-block;width:3px;height:15px;background:var(--accent);border-radius:2px}
#edit-form .hint{font-size:12px;color:var(--ink3);margin:0 0 10px 11px}
#edit-form .sub-title{font-size:13px;font-weight:500;color:var(--accent2);margin:6px 0 8px}
#edit-form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-bottom:12px}
#edit-form .grid .wide{grid-column:1/-1}
#edit-form textarea{min-height:60px;resize:vertical;line-height:1.6}
#edit-form input[readonly]{background:var(--paper2);color:var(--ink3)}
#edit-form .rg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0}
#edit-form .rg label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;cursor:pointer}
#edit-form .rg input{width:auto;padding:0;accent-color:var(--accent)}
#edit-form .rowcard{border:1px dashed var(--paper3);border-radius:8px;padding:10px 12px 2px;margin-bottom:10px;background:var(--paper)}
#edit-form .rowcard h4{font-size:13px;font-weight:500;color:var(--accent2);margin-bottom:8px}
#edit-form .rq{color:var(--danger);margin-left:2px}
#edit-form .err-f input,#edit-form .err-f select{border-color:var(--danger);background:#fff7f6}
#edit-form .photo{display:flex;gap:14px;align-items:center}
#edit-form .photo .box{width:90px;height:120px;border:1px dashed var(--paper3);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px;text-align:center;overflow:hidden;background:var(--paper2);flex-shrink:0}
#edit-form .photo img{width:100%;height:100%;object-fit:cover}
#edit-form .photo small{display:block;color:var(--ink3);font-size:12px;margin:5px 0}
html.embed .sidebar-logo,html.embed .sidebar-footer{display:none!important}
html.embed .nav-item[data-standalone]{display:none!important}
@media(max-width:700px){.sidebar{display:none}.tab-content{padding:18px 14px}.stat-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
/* ═══════ Supabase（連線資訊在 supabase-config.js）═══════ */
var EMBED = new URLSearchParams(location.search).get('embed') === '1';
var currentAdmin = null, allRecords = [], currentRec = null, sortDesc = true, photoCache = {};
var $ = function (s) { return document.getElementById(s); };
var sb = supabase.createClient(SB.url, SB.anonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'dx-sb-session' } });
function errText(e) { return (e && (e.message || e.error_description)) || String(e); }
function sessionExpired() {
  showToast('登入已逾時，請重新登入', 'error');
  if (EMBED) parent.postMessage({ type: 'dx-expired' }, '*'); else doLogout();
}
async function sbCheck(res) {                       // 統一處理 Supabase 回傳：有錯誤就丟出例外，登入過期則回到登入畫面
  if (res.error) {
    var m = errText(res.error);
    if (/JWT|expired|not authenticated/i.test(m) || res.status === 401) sessionExpired();
    throw new Error(m);
  }
  return res.data;
}
async function accessToken() { var s = await sb.auth.getSession(); return s.data && s.data.session ? s.data.session.access_token : ''; }
async function changePhoto(id, photo) {             // 更換／移除照片：經由 resume-photo Edge Function（只有管理員可用）
  var body = photo ? { id: id, photo: photo } : { id: id, remove: true };

/* ═══════ 登入（Supabase Auth：Email + 密碼）═══════ */
async function enterFromSession() {                 // 有有效的登入狀態且是管理員，才進入後台
  var s = await sb.auth.getSession(), sess = s.data && s.data.session;

function fmtTime(s) { try { return new Date(s).toLocaleString('sv-SE', { timeZone: 'Asia/Taipei' }); } catch (e) { return s || ''; } }

async function refreshAll() {
  setLoading(true, '載入資料…');
  try {
    var all = [], from = 0, step = 1000;

/* ═══════ 下載 Word（MHTML 格式的 .doc，Word 可直接開啟並可編輯）═══════ */
function b64utf8(str) {
  var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function wrap76(s) { return s.replace(/(.{76})/g, '$1\r\n'); }
/* Word 會替儲存格內的文字加上預設的段落間距，造成文字偏上、列高變大。
   這裡把每個儲存格的內容包進「段落間距為 0」的段落，並明確指定垂直置中（valign + vertical-align）。 */
var CELL_P = '<p style="margin:0;mso-margin-top-alt:0;mso-margin-bottom-alt:0;mso-pagination:none;line-height:100%">';
function wordCells(html) {
  return html.replace(/<td ([^>]*)>([\s\S]*?)<\/td>/g, function (m, attrs, inner) {
    if (attrs.indexOf('data-nb') >= 0) return m;      // 頁首（標題＋照片）的版面表格不處理
    return '<td ' + attrs + ' valign="middle">' + CELL_P + (inner === '' ? '&nbsp;' : inner) + '</p></td>';
  });
}
function docTitle(r) {
  return '<p style="font-size:18pt;font-weight:bold;margin:0 0 2px">敦新科技股份有限公司　個人資料表</p>' +
    '<p style="font-size:9pt;color:#666;margin:0 0 2px">機密文件</p>' +
    '<p style="font-size:9pt;color:#666;margin:0">提交時間：' + esc(r.time) + '　｜　受理編號：' + esc(r.key) + '</p>';
}
function buildWord(r, photo) {
  var imgTag = photo ? 'file:///C:/dx_photo.jpg' : '';
  var title = docTitle(r);
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>個人資料表</title>' +
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
    '<style>@page Section1{size:21cm 29.7cm;margin:0.7cm 0.7cm 0.7cm 0.7cm;mso-header-margin:0.2cm;mso-footer-margin:0.2cm}div.Section1{page:Section1}' +
    'body{font-family:"Microsoft JhengHei","微軟正黑體","PMingLiU";font-size:10pt;color:#1a1814}p{margin:0;mso-margin-top-alt:0;mso-margin-bottom-alt:0}table{border-collapse:collapse}</style></head><body>' +
    '<div class="Section1">' + wordCells(RS.viewHTML(r.d, { photo: imgTag, head: title, fs: '10pt', pad: '0 6px', lh: '1.0', valign: 'middle' })) + '</div></body></html>';
  var B = '----=_NextPart_dx_resume', eol = '\r\n';
  var mime = 'MIME-Version: 1.0' + eol + 'Content-Type: multipart/related; boundary="' + B + '"; type="text/html"' + eol + eol +
    '--' + B + eol + 'Content-Type: text/html; charset="utf-8"' + eol + 'Content-Transfer-Encoding: base64' + eol + 'Content-Location: file:///C:/dx_resume.htm' + eol + eol +
    wrap76(b64utf8(html)) + eol + eol;
  if (photo) {
    var m = photo.match(/^data:(image\/[a-z+]+);base64,(.+)$/);
    if (m) mime += '--' + B + eol + 'Content-Type: ' + m[1] + eol + 'Content-Transfer-Encoding: base64' + eol + 'Content-Location: file:///C:/dx_photo.jpg' + eol + eol + wrap76(m[2]) + eol + eol;
  }
  return mime + '--' + B + '--' + eol;
}
async function downloadWord(r) {
  if (!r) return;
  track('download_word', r.id);
  var btn = $('btn-word'); if (btn) btn.disabled = true;
  try {
    var photo = ''; try { photo = await getPhoto(r); } catch (e) {}
    var blob = new Blob([buildWord(r, photo)], { type: 'application/msword' });
    var p = function (n) { return ('0' + n).slice(-2); }, t = new Date();
    var name = '個人資料_' + (r.name || '未命名') + '_' + (r.job || '').replace(/[\\/:*?"<>|]/g, '') + '_' + t.getFullYear() + p(t.getMonth() + 1) + p(t.getDate()) + '.doc';
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    showToast('已下載 Word 檔', 'success');

  if (btn) btn.disabled = false;
}
/* ═══════ 編輯個人資料 ═══════ */
var editRec = null, editForm = null, editOrigPhoto = '', editBusy = false;
var EDIT_KEEP = ['consent', 'signature', 'sign_date'];     // 聲明書相關欄位不在編輯表單內，原值保留

function editCollect() {
  var d = {};
  Array.prototype.forEach.call(editForm.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'radio') { if (el.checked) d[el.name] = el.value; }
    else if (el.type === 'checkbox') { if (el.checked) d[el.name] = '1'; }
    else if (el.value !== '') d[el.name] = el.value;
  });
  return d;
}
function editFill(d, photo) {
  Object.keys(d).forEach(function (k) {
    editForm.querySelectorAll('[name="' + k.replace(/"/g, '\\"') + '"]').forEach(function (el) {
      if (el.type === 'radio') el.checked = (el.value === d[k]);
      else if (el.type === 'checkbox') el.checked = (d[k] === '1');
      else el.value = d[k];
    });
  });
  editForm.elements['photo'].value = photo || '';
  editShowPhoto(photo);
  editRecalc();
}
function editShowPhoto(src) { var b = editForm.querySelector('#photoBox'); if (b) b.innerHTML = src ? '<img src="' + src + '" alt="照片">' : '2 吋照片<br>（上傳電子檔）'; }
function editNum(n) { var v = parseFloat((editForm.elements[n] || {}).value); return isNaN(v) ? 0 : v; }
function editRecalc() {
  Array.prototype.forEach.call(editForm.querySelectorAll('input[name^="job."][name$=".total"]'), function (el) {
    var k = el.name.replace(/total$/, '');
    var s = editNum(k + 'fixed') + editNum(k + 'allow') + editNum(k + 'other');
    el.value = s ? s : '';
    var m = editNum(k + 'fixed_m') + editNum(k + 'perf_m') + editNum(k + 'bonus_m');
    editForm.elements[k + 'total_m'].value = m ? Math.round(m * 100) / 100 : '';
  });
}
function editSyncAddr() {
  if (!editForm.elements['addr.same'].checked) return;
  editForm.elements['addr.mail'].value = editForm.elements['addr.reg'].value;
  editForm.elements['addr.mail_tel'].value = editForm.elements['addr.reg_tel'].value;
}
function editOnPhoto(e) {                                   // 與求職者頁相同：縮成 480×640 的 JPEG
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var W = 480, H = 640, s = Math.max(W / img.width, H / img.height);
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'), w = img.width * s, h = img.height * s;
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    var q = 0.85, data = c.toDataURL('image/jpeg', q);
    while (data.length > 400000 && q > 0.3) { q -= 0.1; data = c.toDataURL('image/jpeg', q); }
    editForm.elements['photo'].value = data; editShowPhoto(data); URL.revokeObjectURL(url);
  };
  img.onerror = function () { showToast('無法讀取此圖片，請換一張', 'error'); };
  img.src = url;
}
async function openEdit(id) {
  var r = allRecords.filter(function (x) { return x.id === id; })[0]; if (!r) return;
  editRec = r; editForm = $('edit-form');
  $('edit-title').textContent = '編輯個人資料 — ' + r.name + '（' + r.job + '）';
  $('edit-notice').innerHTML = '';
  editForm.innerHTML = RS.formHTML({ skip: ['decl'], data: r.d });       // 資料有幾組就顯示幾組
  var photo = ''; try { photo = await getPhoto(r); } catch (e) {}
  editOrigPhoto = photo;
  editFill(r.d, photo);
  var box = editForm.querySelector('.photo > div:nth-child(2)');       // 在檔案選擇旁加「移除照片」
  if (box) {
    var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'btn-secondary btn-sm'; rm.textContent = '移除照片';
    rm.onclick = function () { editForm.elements['photo'].value = ''; editShowPhoto(''); };
    box.appendChild(rm);
  }
  editForm.oninput = function (e) {
    if (e.target.name && /^job\.\d+\.(fixed|allow|other|fixed_m|perf_m|bonus_m)$/.test(e.target.name)) editRecalc();
    if (editForm.elements['addr.same'].checked && /^addr\.(same|reg|reg_tel)$/.test(e.target.name)) editSyncAddr();
  };
  editForm.onchange = function (e) {
    if (e.target.id === 'photoFile') return editOnPhoto(e);

function closeEdit() {
  if (editBusy) return;
  if (editForm && editRec && !confirm('尚未儲存的修改將會遺失，確定要關閉嗎？')) return;
  closeModal('modal-edit'); editRec = null;
}
async function saveEdit() {
  if (!editRec || editBusy) return;
  var d = editCollect(), photo = d.photo || ''; delete d.photo;
  editForm.querySelectorAll('.err-f').forEach(function (x) { x.classList.remove('err-f'); });
  var errs = [];
  if (!d['basic.name_zh']) errs.push(['basic.name_zh', '中文姓名']);
  if (!d['basic.mobile']) errs.push(['basic.mobile', '行動電話']);
  if (!d['basic.email'] || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d['basic.email'])) errs.push(['basic.email', 'E-mail（需填寫且格式正確）']);
  if (d['basic.id_no'] && !/^[A-Za-z][A-Za-z0-9]\d{8}$/.test(d['basic.id_no'])) errs.push(['basic.id_no', '身份證字號格式']);
  if (errs.length) {
    errs.forEach(function (e) { var b = editForm.querySelector('[data-f="' + e[0] + '"]'); if (b) b.classList.add('err-f'); });
    $('edit-notice').innerHTML = '<div style="background:#fceaea;border-left:3px solid var(--danger);color:var(--danger);padding:10px 14px;margin-bottom:14px;font-size:14px">請修正：' + errs.map(function (e) { return e[1]; }).join('、') + '</div>';
    var first = editForm.querySelector('[data-f="' + errs[0][0] + '"]'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  // 以原資料為底：表單內的欄位以表單為準（清空即刪除），聲明書相關欄位保留原值
  var merged = {};
  RS.list.forEach(function (e) {
    if (EDIT_KEEP.indexOf(e.key) >= 0) { if (editRec.d[e.key]) merged[e.key] = editRec.d[e.key]; }
    else if (d[e.key] !== undefined) merged[e.key] = d[e.key];
  });
  Object.keys(d).forEach(function (k) {                // 超出預設組數的組別（第 7、8… 組）不在 RS.list 裡，也要保留
    if (/^(lang|fam|pc|cert|ref|job)\.\d+\.\w+$/.test(k) && !(k in merged)) merged[k] = d[k];
  });
  var clean = {};
  Object.keys(merged).forEach(function (k) { if (merged[k] !== '' && merged[k] != null) clean[k] = String(merged[k]); });
  var photoChanged = (photo !== editOrigPhoto);

  editBusy = true; var btn = $('btn-edit-save'); btn.disabled = true; btn.textContent = '儲存中…';
  try {
    var rows = await sbCheck(await sb.from('resumes').update({ data: clean }).eq('id', editRec.id).select('id'));
    if (!rows || !rows.length) throw new Error('沒有更新到資料（可能沒有權限或資料已被刪除）');
    if (photoChanged) await changePhoto(editRec.id, photo || '');
    delete photoCache[editRec.id];
    editBusy = false; editRec = null; closeModal('modal-edit');
    showToast('已儲存修改', 'success');
    await refreshAll();
  } catch (e) {
    $('edit-notice').innerHTML = '<div style="background:#fceaea;border-left:3px solid var(--danger);color:var(--danger);padding:10px 14px;margin-bottom:14px;font-size:14px">儲存失敗：' + esc(e.message) + '</div>';
    $('edit-body').scrollTop = 0;
  }
  editBusy = false; btn.disabled = false; btn.textContent = '儲存修改';
}

/* ═══════ 下載 PDF（A4、多頁；換頁盡量落在表格列與段落之間，避免切斷文字）═══════ */
async function downloadPDF(r) {
  if (!r) return;
  track('download_pdf', r.id);
  if (!window.html2canvas || !window.jspdf) { showToast('PDF 元件載入失敗，請確認網路連線後重新整理頁面', 'error'); return; }
  var btn = $('btn-pdf'); if (btn) { btn.disabled = true; btn.textContent = '產生 PDF 中…'; }
  var holder = null;
  try {
    var photo = ''; try { photo = await getPhoto(r); } catch (e) {}
    holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;box-sizing:border-box;padding:0 3px 0 1px;background:#fff;color:#1a1814;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.4';
    holder.innerHTML = RS.viewHTML(r.d, { photo: photo, head: docTitle(r), fs: '10pt', pad: '3px 6px', lh: '1.3' });
    document.body.appendChild(holder);
    if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 3000); })]);   // 字型載入太久就不等了
    var scale = 2;
    var canvas = await html2canvas(holder, { scale: scale, backgroundColor: '#ffffff', useCORS: true, logging: false });

    // 可換頁的位置：表格列底部、一般段落底部（標題與小標題不可，避免標題落單）
    var top = holder.getBoundingClientRect().top, cuts = [];
    holder.querySelectorAll('tr, p').forEach(function (el) {
      if (el.tagName === 'P' && (el.style.fontWeight === 'bold' || el.style.borderBottom)) return;
      cuts.push(Math.round((el.getBoundingClientRect().bottom - top) * scale));
    });
    cuts.sort(function (a, b) { return a - b; });

    var jsPDF = window.jspdf.jsPDF, pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    var M = 10, W = 210 - 2 * M, H = 297 - 2 * M;
    var pxPerMm = canvas.width / W, sliceH = Math.floor(H * pxPerMm), y = 0, page = 0;
    while (y < canvas.height - 2) {
      var end = Math.min(y + sliceH, canvas.height);
      if (end < canvas.height) {
        var best = 0;
        for (var i = 0; i < cuts.length; i++) { if (cuts[i] > y + sliceH * 0.3 && cuts[i] <= y + sliceH) best = cuts[i]; }
        if (best) end = best;
      }
      var s = document.createElement('canvas'); s.width = canvas.width; s.height = end - y;
      var cx = s.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, s.width, s.height);
      cx.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
      if (page > 0) pdf.addPage();
      pdf.addImage(s.toDataURL('image/jpeg', 0.92), 'JPEG', M, M, W, (end - y) / pxPerMm);
      y = end; page++;
    }
    var p2 = function (n) { return ('0' + n).slice(-2); }, d0 = new Date();
    pdf.save('個人資料_' + (r.name || '未命名') + '_' + (r.job || '').replace(/[\\/:*?"<>|]/g, '') + '_' + d0.getFullYear() + p2(d0.getMonth() + 1) + p2(d0.getDate()) + '.pdf');
    showToast('已下載 PDF（共 ' + page + ' 頁）', 'success');
  } catch (e) { showToast('PDF 產生失敗：' + e.message, 'error'); }
  if (holder && holder.parentNode) holder.parentNode.removeChild(holder);
  if (btn) { btn.disabled = false; btn.textContent = '⬇ 下載 PDF'; }
}
</script>
